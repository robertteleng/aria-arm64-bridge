[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aria-arm64-bridge"
version = "0.2.0"
description = "Run Meta Aria glasses on ARM64 (Jetson) via FEX-Emu binary translation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Roberto Rojo" },
]
keywords = ["aria", "meta", "jetson", "arm64", "fex-emu", "streaming", "zmq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering",
]
# Core stays deliberately tiny: a consumer only needs to pull bytes off a ZMQ
# socket and hand back numpy arrays. Flask/Pillow are dashboard-only and psutil
# is telemetry-only, so neither is forced on a pipeline that just wants frames.
dependencies = [
    "pyzmq>=25.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
telemetry = ["psutil>=5.9"]
dashboard = ["flask>=3.1.3", "pillow>=12.2.0"]

[project.scripts]
# The receiver entry point is meant to be run inside the FEX-Emu x86_64 rootfs.
aria-bridge-receiver = "aria_arm64_bridge.receiver:main"
aria-bridge-mock = "aria_arm64_bridge.mock_receiver:main"
aria-bridge-dashboard = "aria_arm64_bridge.dashboard.server:main"

[project.urls]
Repository = "https://github.com/robertteleng/aria-arm64-bridge"
Documentation = "https://github.com/robertteleng/aria-arm64-bridge#readme"
Issues = "https://github.com/robertteleng/aria-arm64-bridge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/aria_arm64_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: needs Aria glasses, FEX-Emu and a Jetson — skipped in CI",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
